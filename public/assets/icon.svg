<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBlueGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="iconPulse" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="iconDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="196" height="196" rx="44" fill="url(#iconDarkBg)" stroke="url(#iconBlueGreen)" stroke-width="4" />

  <!-- Funil de Vendas -->
  <path d="M 40 46 L 160 46 L 140 85 L 60 85 Z" fill="#2563EB" opacity="0.35" />
  <path d="M 64 90 L 136 90 L 120 125 L 80 125 Z" fill="#2563EB" opacity="0.6" />
  <path d="M 84 130 L 116 130 L 108 162 L 92 162 Z" fill="#10B981" opacity="0.9" />

  <!-- Linha de Pulso -->
  <path d="M 24 105 L 58 105 L 72 75 L 94 138 L 112 88 L 126 115 L 142 105 L 176 105" 
        fill="none" 
        stroke="url(#iconPulse)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#iconGlow)" />

  <!-- Nós de IA -->
  <circle cx="100" cy="46" r="5" fill="#60A5FA" filter="url(#iconGlow)" />
  <circle cx="72" cy="75" r="5.5" fill="#38BDF8" filter="url(#iconGlow)" />
  <circle cx="94" cy="138" r="6" fill="#10B981" filter="url(#iconGlow)" />
  <circle cx="112" cy="88" r="5.5" fill="#34D399" filter="url(#iconGlow)" />
  <circle cx="100" cy="162" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2" filter="url(#iconGlow)" />

  <!-- Conexões de Rede Neural -->
  <line x1="100" y1="46" x2="72" y2="75" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
  <line x1="72" y1="75" x2="112" y2="88" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
  <line x1="94" y1="138" x2="100" y2="162" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
</svg>
