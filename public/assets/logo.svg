<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Gradiente Principal LeadPulse -->
    <linearGradient id="blueGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="aiPulseGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="darkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Filtro de Glow / Brilho Neon para IA -->
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- SÍMBOLO DA MARCA / ICONE (X: 40, Y: 20, W: 200, H: 200) -->
  <g transform="translate(30, 20)">
    <!-- Fundo arredondado do badge -->
    <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#darkBgGrad)" stroke="url(#blueGreenGrad)" stroke-width="3" />

    <!-- 1. FUNIL DE VENDAS (GEOMÉTRICO MODERNO) -->
    <!-- Topo do Funil -->
    <path d="M 40 48 L 160 48 L 140 85 L 60 85 Z" fill="#2563EB" opacity="0.35" />
    <!-- Meio do Funil -->
    <path d="M 64 90 L 136 90 L 120 125 L 80 125 Z" fill="#2563EB" opacity="0.6" />
    <!-- Fundo do Funil / Saída -->
    <path d="M 84 130 L 116 130 L 108 162 L 92 162 Z" fill="#10B981" opacity="0.9" />

    <!-- 2. LINHA DE PULSO COGNITIVO (EKG / COMMERCIAL PULSE) -->
    <path d="M 24 105 L 58 105 L 72 75 L 94 138 L 112 88 L 126 115 L 142 105 L 176 105" 
          fill="none" 
          stroke="url(#aiPulseGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#aiGlow)" />

    <!-- 3. NÓS DE INTELIGÊNCIA ARTIFICIAL (SYNAPTIC AI NODES) -->
    <!-- Nó Entrada Topo -->
    <circle cx="100" cy="48" r="5" fill="#60A5FA" filter="url(#aiGlow)" />
    <!-- Nó Pico Pulso Superior -->
    <circle cx="72" cy="75" r="5.5" fill="#38BDF8" filter="url(#aiGlow)" />
    <!-- Nó Vale Pulso Inferior -->
    <circle cx="94" cy="138" r="6" fill="#10B981" filter="url(#aiGlow)" />
    <!-- Nó Pico Médio -->
    <circle cx="112" cy="88" r="5.5" fill="#34D399" filter="url(#aiGlow)" />
    <!-- Nó Saída Qualificada -->
    <circle cx="100" cy="162" r="6.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2" filter="url(#aiGlow)" />

    <!-- Conexões Sinápticas (Rede Neural) -->
    <line x1="100" y1="48" x2="72" y2="75" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
    <line x1="72" y1="75" x2="112" y2="88" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
    <line x1="94" y1="138" x2="100" y2="162" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
  </g>

  <!-- TIPOGRAFIA E BRANDING (X: 260) -->
  <g transform="translate(260, 135)">
    <!-- Texto "Lead" -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#0F172A" letter-spacing="-2">Lead</text>
    <!-- Texto "Pulse" -->
    <text x="175" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="url(#blueGreenGrad)" letter-spacing="-2">Pulse</text>
    
    <!-- Badge "AI" -->
    <g transform="translate(390, -56)">
      <rect x="0" y="0" width="94" height="48" rx="14" fill="url(#blueGreenGrad)" />
      <text x="47" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AI</text>
    </g>

    <!-- Assinatura / Tagline -->
    <text x="2" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#64748B" letter-spacing="3.5">INTELLIGENT LEAD QUALIFICATION</text>
  </g>
</svg>
